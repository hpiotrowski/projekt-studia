version: '3.8'

services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
    volumes:
      - keycloak-data:/opt/keycloak/data
    command: start-dev
    depends_on:
      - keycloak-db
    networks:
      - auth-network
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  resource-server:
    build: ./resource-server
    container_name: resource-server
    ports:
      - "5001:5001"
    depends_on:
      - db
      - keycloak
    networks:
      - app-network
      - db-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-spa:
    build: ./frontend-spa
    container_name: frontend-spa
    ports:
      - "3000:3000"
    depends_on:
      - resource-server
      - keycloak
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend-ssr:
    build: ./frontend-ssr
    container_name: frontend-ssr
    ports:
      - "4000:4000"
    depends_on:
      - resource-server
      - keycloak
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend2backend-client:
    build: ./b2b-client
    container_name: backend2backend-client
    environment:
      - CLIENT_SECRET=Asbcmz8DreijP9iWzIvoXu3P0wehl4Wc
      - KEYCLOAK_URL=http://keycloak:8080
      - RESOURCE_SERVER_URL=http://resource-server:5001
    ports:
      - "5002:5002"
    depends_on:
      - resource-server
      - keycloak
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16
    container_name: db
    environment:
      POSTGRES_DB: car_rental
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    volumes:
      - car-rental-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d car_rental"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  auth-network:
    driver: bridge
    name: car-rental-auth
  app-network:
    driver: bridge
    name: car-rental-app
  db-network:
    driver: bridge
    name: car-rental-db

volumes:
  keycloak-data:
    driver: local
  keycloak-db-data:
    driver: local
  car-rental-db-data:
    driver: local
